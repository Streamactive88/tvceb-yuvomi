version: '3.8'
services:
  tvceb:
    image: tvceb:2.82.0-synology
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tvceb
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "3245:3000"
    volumes:
      - /volume1/docker/yuvomi/data:/data:rw
      - /volume1/docker/yuvomi/backups:/backups:rw
      - /volume1/docker/yuvomi/modules:/app/modules:rw
      - /volume1/docker/yuvomi/documents:/documents:rw
    environment:
      NODE_ENV: production
      DB_PATH: /data/yuvomi.db
      BACKUP_DIR: /backups
      MODULES_DIR: /app/modules
      DOCUMENT_STORAGE_LOCAL_ENABLED: "true"
      DOCUMENT_STORAGE_LOCAL_PATH: /documents
      SESSION_SECURE: "${SESSION_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in the project .env}"
      DB_ENCRYPTION_KEY: "${DB_ENCRYPTION_KEY:-}"
      TZ: Europe/Bucharest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: on-failure:5
